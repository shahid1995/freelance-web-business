# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '38 4 * * 3'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # The Codacy CLI writes one SARIF run per analyzer and sets no per-run
      # category (26 runs on this repository). Since 2025-07-22, GitHub code
      # scanning rejects SARIF files containing multiple runs that share a
      # tool+category, so give every run a distinct automationDetails.id
      # before upload. All findings are preserved; nothing is dropped or
      # suppressed:
      # https://github.blog/changelog/2025-07-21-code-scanning-will-stop-combining-multiple-sarif-runs-uploaded-in-the-same-sarif-file/
      - name: Assign distinct SARIF run categories
        run: |
          jq '.runs |= (to_entries | map(
            .value + {automationDetails: {id: ((.value.tool.driver.name // "codacy") + "/" + (.key | tostring))}}
          ))' results.sarif > results.categorized.sarif
          mv results.categorized.sarif results.sarif

      # Code scanning also accepts at most 20 runs per SARIF file (this
      # repository produces 26), and a directory upload was observed to be
      # submitted as a single 26-run analysis, which the server rejected.
      # Split the runs into <=20-run files and upload each file explicitly
      # under its own category (uploads with different categories are never
      # combined). No run or result is dropped. The guard below fails loudly
      # instead of silently dropping data if the tool count ever needs a
      # third part:
      - name: Split SARIF into upload-sized files
        run: |
          mkdir -p sarif-parts
          total=$(jq '.runs | length' results.sarif)
          i=0; part=0
          while [ "$i" -lt "$total" ]; do
            jq --argjson i "$i" '.runs = .runs[$i:$i+20]' results.sarif > "sarif-parts/results-$part.sarif"
            i=$((i + 20)); part=$((part + 1))
          done
          echo "Split $total runs into $part file(s):"
          ls -la sarif-parts
          if [ "$part" -gt 2 ]; then
            echo "::error::Codacy produced $part SARIF parts but this workflow uploads at most 2 (40 runs). Extend the upload steps rather than dropping data."
            exit 1
          fi

      # Upload each SARIF part as its own code-scanning analysis
      - name: Upload SARIF part 1 (runs 1-20)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-parts/results-0.sarif
          category: codacy-part-1

      - name: Upload SARIF part 2 (runs 21+)
        if: hashFiles('sarif-parts/results-1.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-parts/results-1.sarif
          category: codacy-part-2
